[project]
name = "tdd-state-report"
version = "0.1.0"
description = "Zerocode TDD state transition report: one shareable SFEO-style HTML from Zerocode JSON reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tdd-state-report = "tdd_state_report.build_report:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdd_state_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
